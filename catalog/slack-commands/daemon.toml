[daemon]
backend = "claude"
# Inbox-driven: the slack-channel-watch front door queues a message and nudges
# `daimon run slack-commands`; the inbox gate launches immediately. The
# schedule is only a fallback sweep for messages queued while a run was
# already in flight.
schedule = { interval = 900 }
command = "/slack-commands"
# Command handling is short by construction: long work (the urgent-fix
# path) is launched as a detached process the engine does not wait on, so
# this only needs to cover replying to a burst of queries.
stuck_after = 1800
# Own launch budget: command handling must not be starved by other daemons
# burning the global pool (inbox-nudged launches bypass budgets anyway;
# this covers the scheduled fallback sweep).
hourly_cap = 30

[inputs]
# Command plugins: one markdown runbook per command. Shared plugins ship
# with the daemon (commands_dir; {{daemon_dir}} is the folder this daemon
# loads from, so an ejected copy reads its own); local_commands_dir holds
# your own runbooks and overrides shared ones on name conflict.
# Empty = ~/.daimon/commands (the folder holding daimon.toml).
commands_dir = "{{daemon_dir}}/commands"
local_commands_dir = ""
# Absolute paths of extra runbook folders, read after commands_dir and before
# local_commands_dir. Empty = every configured pack's commands/ (docs/packs.md).
pack_commands_dirs = []
# Slack user IDs allowed to run plugins marked `mutating: true`. Empty =
# nobody can run mutating commands.
mutate_allowlist = []
