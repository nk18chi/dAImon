[daemon]
backend = "claude"
schedule = { minutes = [3, 23, 43] }
command = "/pr-manager"
stuck_after = 1800
required_inputs = ["base", "manage_label", "merge_method"]

[inputs]
base = "main"
# A PR is "managed" if it is on a daimon/* branch (work-queue created it) or it
# carries this label (you opted a hand-authored PR in).
manage_label = "auto-pr-manage"
# Prefix on every comment this daemon posts, so reply-to-pr-comments can tell its
# own comments from human replies.
bot_marker = "🤖"
# How approved PRs get merged: squash | merge | rebase.
merge_method = "squash"
# Per-run cap on fix attempts for a single PR before it is parked as ci-blocked.
max_fix_cycles = 3
# Re-evaluate a parked ci-blocked PR only after this many hours (avoids burning
# runs on a PR whose upstream cause has not changed).
blocked_recheck_hours = 6
# Flip a green, conflict-free, non-change-requested managed draft to ready-for-review
# so it enters the merge flow. Promotion does not merge — that still needs approval.
promote_drafts = true
# Minimum draft age (hours) before auto-promoting. 0 = promote as soon as it's green.
promote_min_age_hours = 2
# GitHub logins requested as reviewers on every managed PR (and on promotion).
# Blank relies on CODEOWNERS; with neither, a PR has no approver and never merges.
reviewers = []
# Merge green, non-conflicting, non-change-requested PRs WITHOUT an approving
# review. Off by default: unreviewed AI-authored code reaching the base branch is
# a deliberate choice. promote_min_age_hours stays the human intervention window.
auto_merge = false
# A managed PR carrying this label is repaired (conflicts, failing CI, review
# feedback, reviewers, promotion) but never merged, approved or not: a person
# merges it. For PRs another daemon opens where the team wants a human to press
# merge. Blank = no such label.
no_merge_label = ""
# Optional business-hours merge window. Leave all three blank to merge any time
# CI is green. Set all three to gate ONLY the merge action (conflict and CI
# fixes always run). e.g. tz = "America/Toronto", start = "9", end = "21".
# Comments from an automated reviewer that carry review findings: any comment
# containing this text counts as review feedback (blank = only changes-requested
# reviews count). A comment matching findings_none_regex (e.g. "0 findings") is
# ignored. Unhandled feedback blocks merging until it is addressed.
findings_marker = ""
findings_none_regex = ""
# When a PR's body records the session that wrote it (`daimon-session: <id>`) and
# that session's transcript is on this machine, resume it to address feedback,
# so the agent keeps the context it built while writing the PR.
resume_author = true
merge_window_tz = ""
merge_window_start = ""
merge_window_end = ""
