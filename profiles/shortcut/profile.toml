[profile]
tool = "shortcut"
description = "Shortcut stories via the Shortcut REST API"

[defaults]
team = ""
owner = ""
triage_state = "To Do"
in_progress_state = "In Development"
done_state = "Done"
ready_label = "ai-ready"
assist_label = "ai-assist"
human_label = "ai-human"
priority_label = "ai-priority"
skip_label = "no-ai"
epic_id = ""
exclude_epics = []
# Value of the workspace's "Product Area" custom field to stamp on every story a
# daemon creates. Blank = leave it unset, which is right for the fleet default:
# the product area is a property of what a daemon watches, not of the workspace,
# so each story-filing daemon sets its own in [inputs]. Must match the option
# label in Shortcut exactly — an unrecognized value fails the create.
product_area = ""
