[daemon]
backend = "claude"
sources = [{ name = "acr", write = true }]
schedule = { minutes = [5, 25, 45], days = "mon-fri" }
command = "/acr-fixer"
stuck_after = 2700
# Both are read by discover.sh; an empty one would crash the gate under `set -u`,
# which is indistinguishable from "no work" and would disable the daemon silently.
required_inputs = ["skip_label", "max_rounds"]

[inputs]
# Prefix on every comment this daemon posts, so reply-to-pr-comments can tell its
# own comments from human replies.
bot_marker = "🤖"
# Opt a PR OUT of automated fixing by adding this label. Default-on is deliberate:
# every PR ACR reviews is one this daemon should try to close out.
skip_label = "acr-no-autofix"
# Hard stop on the ACR round the daemon will act on. Past this, the PR is parked
# for a human — a fix that has not converged in this many rounds is not going to.
max_rounds = 5
# Path to your ACR checkout, used to re-trigger your OWN instance after a push
# (`pnpm -C <path> review owner/repo#N`) — the poller never re-queues a completed
# review of a PR you authored. Machine-local, so set it in daemon.local.toml.
# Blank = skip that step; other reviewers are still re-requested via gh.
acr_repo = ""
# Per-run cap on PRs to work through, newest-verdict first. Keeps one run bounded.
max_prs_per_run = 3
# Findings to attempt on a single PR in one run. Beyond this, fix the rest next
# round rather than pushing one enormous commit.
max_findings_per_pr = 20
